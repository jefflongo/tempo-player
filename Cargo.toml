[package]
name = "tempo-player"
version = "0.1.0"
edition = "2024"
description = "A simple command-line audio player designed to help with instrument practice"
authors = ["Jeff Longo <jeff.a.longo@gmail.com>"]
license = "GPL-2.0-or-later"
readme = "README.md"
repository = "https://github.com/jefflongo/tempo-player"

[dependencies]
anyhow = "1.0.104"
bounded-integer = { version = "0.6.2", features = ["macro"] }
clap = { version = "4.6.6", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0.0"
event-stream = "0.1.1"
features = "0.10.0"
futures = "0.3.34"
ratatui = "0.30.2"
rodio = "0.22.2"
rubberband = "0.1.3"
tempfile = "3.27.0"
tokio = "1.53.1"
url = "2.5.8"
which = "8.0.6"
yt-dlp = { git = "https://github.com/jefflongo/yt-dlp.git", branch = "search-first-fix" }
